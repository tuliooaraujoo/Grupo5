version: '3.9'
services:
  backend:
    image: bytebank/backend
    container_name: backend
    networks:
      - compose-bridge
    ports:
      - 3001:3001

  frontend:
    image: bytebank/frontend
    container_name: frontend
    networks:
      - compose-bridge
    ports:
      - 3000:3000
    depends_on:
      - dashboard

  dashboard:
    build:
      context: ./dashboard  # Caminho para o diretório do dashboard
    container_name: dashboard
    networks:
      - compose-bridge
    ports:
      - 3002:3002
    
networks:
  compose-bridge:
    driver: bridge
